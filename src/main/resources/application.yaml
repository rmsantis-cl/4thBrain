spring:
  application:
    name: 4thBrain
  datasource:
    url: jdbc:sqlite:data/fourthbrain.db
    driver-class-name: org.sqlite.JDBC
    initialization-mode: always
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /

actuators:
  threads:
    ingestor: 1
    textExtractor: 1
    classifier: 1
    indexer: 1
    clipper: 1
    # No Briefing class exists in src/main yet; reserved for Phase 2 (P1.9).
    briefing: 1
  shutdown:
    # Milliseconds one actuator thread is given to leave its run loop before it
    # is logged and left to the JVM (P1.15).
    join-timeout-ms: 5000

shutdown:
  # Milliseconds between /api/shutdown answering and the context closing, so the
  # response reaches the caller before the web server stops (P1.15, ADR36).
  close-delay-ms: 500

recovery:
  # How long a document may hold a gerund status before startup treats the
  # actuator that held it as crashed and requeues it. One hour (P1.16, ADR37).
  stale-after-ms: 3600000

ollama:
  url: http://localhost:11434/v1
  model: mistral
  concurrency: 1

vault:
  path: ./vault
  incoming : ${vault.path}/incoming
  indexing : ${vault.path}/indexing
  raw : ${vault.path}/raw
  tmp:  ./tmp
  indexer:
    # Area the Indexer takes its source copy from. Becomes "incoming"
    # once Extractor writes sanitized output there (P2.3).
    source-area: tmp


logging:
  file:
    name: 'log/application.log'
  level:
    root: WARN
    com.fourthbrain: DEBUG
