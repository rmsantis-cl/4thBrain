spring:
  application:
    name: 4thBrain
  datasource:
    url: jdbc:sqlite:data/fourthbrain.db
    driver-class-name: org.sqlite.JDBC
    initialization-mode: always
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /

actuators:
  threads:
    ingestor: 1
    textExtractor: 1
    classifier: 1
    indexer: 1
    clipper: 1
    # No Briefing class exists in src/main yet; reserved for Phase 2 (P1.9).
    briefing: 1

ollama:
  url: http://localhost:11434/v1
  model: mistral
  concurrency: 1

vault:
  path: ./vault
  incoming : ${vault.path}/incoming
  indexing : ${vault.path}/indexing
  raw : ${vault.path}/raw
  tmp:  ./tmp
  indexer:
    # Area the Indexer takes its source copy from. Becomes "incoming"
    # once Extractor writes sanitized output there (P2.3).
    source-area: tmp


fourthbrain:
  converter:
    implementation: markitdown
    fail-fast: false
    supported-extensions: [pdf, docx, doc, pptx, xlsx, xls, html, htm, epub, msg, csv, json, xml]
    passthrough-extensions: [md, markdown, txt, text]
    min-output-chars: 1
    max-input-bytes: 104857600
    max-output-bytes: 33554432
    max-concurrent-processes: 2
    markitdown:
      executable: ""
      python: ""
      expected-version: ""
      version-check: warn
      timeout: 120s
      work-dir: ""
      env:
        PYTHONUTF8: "1"
        PYTHONIOENCODING: "utf-8"

logging:
  file:
    name: 'log/application.log'
  level:
    root: WARN
    com.fourthbrain: DEBUG
