spring:
  application:
    name: 4thBrain
  datasource:
    url: jdbc:sqlite:data/fourthbrain.db
    driver-class-name: org.sqlite.JDBC
    initialization-mode: always
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /

actuators:
  threads:
    ingestor: 1
    textExtractor: 1
    classifier: 1
    indexer: 1
    briefing: 1

ollama:
  url: http://localhost:11434/v1
  model: mistral
  concurrency: 1

vault:
  path: ./vault
  incomingPath: ./vault/incoming

logging:
  level:
    root: INFO
    com.fourthbrain: DEBUG
