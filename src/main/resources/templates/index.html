<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4thBrain — Second Brain</title>
  <style>
    :root {
      --bg: #191817;
      --surface: #211f1d;
      --surface-hover: #2a2825;
      --border: #34322e;
      --text-primary: #f2efe9;
      --text-secondary: #a3a099;
      --text-muted: #6f6c66;
      --accent: #d97757;
      --accent-hover: #c96a4c;
      --status-active: #5b9dd9;
      --status-done: #6fae7c;
      --status-failed: #c9645a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, "Segoe UI", Inter, sans-serif;
      font-size: 14px;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: 200px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 12px 8px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 4px;
      transition: all 0.2s;
    }

    .nav-item:hover {
      background: var(--surface-hover);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: var(--accent);
      color: var(--bg);
    }

    .nav-item .icon {
      display: inline-flex;
      width: 24px;
      justify-content: center;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .topbar-left h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    .panels-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .panel h1 {
      margin: 0 0 8px 0;
      font-size: 20px;
      font-weight: 600;
    }

    .panel .subtitle {
      color: var(--text-secondary);
      margin: 0 0 16px 0;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    input[type="text"],
    input[type="url"],
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-primary);
      border-radius: 4px;
      font-family: inherit;
      font-size: 14px;
      margin-bottom: 8px;
    }

    input[type="text"]:focus,
    input[type="url"]:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--surface);
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    .btn {
      background: var(--accent);
      color: var(--bg);
      border: none;
      padding: 10px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 6px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s;
      margin-bottom: 12px;
    }

    .dropzone:hover,
    .dropzone.dragover {
      border-color: var(--accent);
      background: var(--bg);
      color: var(--accent);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      text-align: center;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 600;
      color: var(--accent);
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* Composer (Story P1.18, ADR27) */

    .composer {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      padding: 12px;
      transition: border-color 0.2s;
    }

    .composer:focus-within { border-color: var(--accent); }

    .composer.dragover {
      border-color: var(--accent);
      background: var(--surface-hover);
    }

    .composer textarea {
      border: none;
      background: transparent;
      color: var(--text-primary);
      resize: none;
      min-height: 72px;
      max-height: 240px;
      overflow-y: auto;
      width: 100%;
      padding: 0;
      margin: 0;
      outline: none;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.5;
    }

    .composer textarea:focus { background: transparent; }

    .composer-attachments {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
    }

    .attachment-chip {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2px 8px;
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .attachment-chip.error {
      border-color: var(--status-failed);
      color: var(--status-failed);
    }

    .attachment-chip .remove-btn {
      cursor: pointer;
      border: none;
      background: transparent;
      color: inherit;
      padding: 0;
      font-weight: bold;
      font-size: 14px;
      line-height: 1;
    }

    .composer-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }

    .composer-actions {
      display: flex;
      gap: 6px;
    }

    .composer-attach {
      width: 32px;
      padding: 6px 0;
      font-size: 18px;
      line-height: 1;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .btn-ghost:hover:not(:disabled) {
      background: var(--surface-hover);
      color: var(--text-primary);
    }

    .btn:disabled,
    .btn-ghost:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn:disabled:hover { background: var(--accent); }
    .btn-ghost:disabled:hover { background: transparent; color: var(--text-secondary); }

    .feed {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 16px;
    }

    .feed-entry {
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid var(--border);
      background: var(--surface);
    }

    .feed-entry.receipt    { border-left: 3px solid var(--status-active); }
    .feed-entry.user-query { border-left: 3px solid var(--accent); color: var(--text-primary); }
    .feed-entry.reply      { border-left: 3px solid var(--status-done); }
    .feed-entry.error      { border-left: 3px solid var(--status-failed); color: var(--status-failed); }

    @media (max-width: 768px) {
      .sidebar {
        display: none;
        position: fixed;
        left: 0;
        top: 44px;
        width: 100%;
        height: calc(100vh - 44px);
        z-index: 10;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      .sidebar.open {
        display: flex;
      }

      .topbar {
        display: flex;
      }

      .menu-btn {
        display: block;
      }

      .topbar-left {
        flex: 1;
      }

      .main-content {
        padding-top: 44px;
      }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <nav id="nav-container"></nav>
  </aside>

  <div class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <h1>4thBrain</h1>
      </div>
      <button class="menu-btn" style="display:none; width: 36px; height: 36px; border: 1px solid var(--border); background: var(--surface); color: var(--text-primary); border-radius: 4px; cursor: pointer;">☰</button>
    </div>

    <div class="panels-container" id="panels-container"></div>
  </div>

  <script>
    // Nav is four items (ADR27 decision 8): Add File, Add Text, Add URL and Chat
    // with Llama all fold into the composer.
    const NAV_ITEMS = [
      { id: "composer", icon: "✎", label: "Composer" },
      { id: "search", icon: "🔍", label: "Search" },
      { id: "ingest-status", icon: "▤", label: "Ingest status" },
      { id: "admin", icon: "⚙", label: "Admin", href: "/admin" },
    ];

    function renderNav() {
      const nav = document.getElementById("nav-container");
      nav.innerHTML = NAV_ITEMS.map((item, i) => {
        if (item.href) {
          return `<a class="nav-item" href="${item.href}"><span class="icon">${item.icon}</span> ${item.label}</a>`;
        }
        return `<button class="nav-item${i === 0 ? " active" : ""}" data-panel="${item.id}"><span class="icon">${item.icon}</span> ${item.label}</button>`;
      }).join("");

      document.querySelectorAll(".nav-item[data-panel]").forEach(btn => {
        btn.addEventListener("click", (e) => {
          document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
          document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
          btn.classList.add("active");
          document.getElementById("panel-" + btn.getAttribute("data-panel")).classList.add("active");
        });
      });
    }

    function renderPanels() {
      const container = document.getElementById("panels-container");
      container.innerHTML = `
        <section class="panel active" id="panel-composer">
          <div class="composer" id="composer">
            <textarea id="composer-input" placeholder="Type a note, paste a link, or ask…"></textarea>
            <div class="composer-attachments" id="composer-attachments"></div>
            <div class="composer-controls">
              <button type="button" class="btn btn-ghost composer-attach" id="composer-attach" title="Attach a file">+</button>
              <div class="composer-actions">
                <button type="button" class="btn btn-ghost" id="btn-ask">ASK</button>
                <button type="button" class="btn btn-ghost" id="btn-url" disabled>URL</button>
                <button type="button" class="btn" id="btn-send">SEND</button>
              </div>
            </div>
          </div>
          <input type="file" id="composer-file" multiple style="display:none">
          <div class="feed" id="feed"></div>
        </section>

        <section class="panel" id="panel-search">
          <h1>Search</h1>
          <p class="subtitle">Keyword and semantic search.</p>
          <div class="card">
            <form id="search-form">
              <input type="text" id="search-input" placeholder="Search vault…">
              <button type="submit" class="btn">Search</button>
            </form>
            <div id="search-results" style="margin-top: 12px;"></div>
          </div>
        </section>

        <section class="panel" id="panel-ingest-status">
          <h1>Ingest status</h1>
          <p class="subtitle">Job queue and pipeline status.</p>
          <button class="btn" id="status-refresh" type="button">Refresh</button>
          <h2 style="margin-top: 16px; margin-bottom: 8px; color: var(--text-secondary);">Job queue</h2>
          <div class="stat-grid" id="jobs-grid"></div>
          <div id="jobs-failed"></div>
        </section>
      `;

      // ---- Composer (Story P1.18, ADR27) ----

      const composer = document.getElementById("composer");
      const input = document.getElementById("composer-input");
      const attachments = document.getElementById("composer-attachments");
      const fileInput = document.getElementById("composer-file");
      const btnAttach = document.getElementById("composer-attach");
      const btnAsk = document.getElementById("btn-ask");
      const btnUrl = document.getElementById("btn-url");
      const btnSend = document.getElementById("btn-send");
      const feed = document.getElementById("feed");
      const panels = document.getElementById("panels-container");

      let stagedFiles = [];
      let chatHistory = [];
      let dragCounter = 0;

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }

      // ADR27 decision 3: the whole trimmed input is one http/https URL and
      // nothing else. Detection only enables the button; it routes nothing.
      function isBareUrl(value) {
        const s = value.trim();
        if (s.length === 0 || /\s/.test(s)) return false;
        try {
          const u = new URL(s);
          return u.protocol === "http:" || u.protocol === "https:";
        } catch {
          return false;
        }
      }

      // The only writer of btnUrl.disabled. Re-enabling the buttons after a
      // request without re-deriving the rule would light URL on plain text,
      // which is the one direction ADR27 says must not happen.
      function updateComposerState(isBusy = false) {
        btnSend.disabled = isBusy;
        btnAsk.disabled = isBusy;
        btnAttach.disabled = isBusy;
        btnUrl.disabled = isBusy || !isBareUrl(input.value);
      }

      function autoGrow(el) {
        el.style.height = "auto";
        el.style.height = Math.min(Math.max(el.scrollHeight, 72), 240) + "px";
      }

      function feedAppend(kind, text) {
        const entry = document.createElement("div");
        entry.className = "feed-entry " + kind;
        entry.innerHTML = escapeHtml(text);
        feed.appendChild(entry);
        panels.scrollTop = panels.scrollHeight;
      }

      // The receipt shows what the server returned at submission and never
      // updates: nothing reports per-document status (DD-2). The label is what
      // makes five receipts in a row tell the user which is which.
      function receiptLine(data, label) {
        return `Doc #${data.id} [${label}] — ${data.status} — ${data.message}`;
      }

      function preview(text) {
        const flat = text.replace(/\s+/g, " ").trim();
        return flat.length > 30 ? flat.slice(0, 30) + "…" : flat;
      }

      async function readJson(res) {
        try {
          return await res.json();
        } catch {
          return {};
        }
      }

      function renderAttachments() {
        attachments.innerHTML = stagedFiles.map((f, i) =>
          `<span class="attachment-chip" data-chip="${i}">${escapeHtml(f.name)}` +
          `<button type="button" class="remove-btn" data-index="${i}" title="Remove">×</button></span>`
        ).join("");
      }

      function markChipError(index) {
        const chip = attachments.querySelector(`[data-chip="${index}"]`);
        if (chip) chip.classList.add("error");
      }

      function stageFiles(fileList) {
        for (const f of fileList) stagedFiles.push(f);
        renderAttachments();
      }

      // SEND fires on text OR staged files. A guard on text alone would make a
      // file-only submission impossible. Nothing is cleared until the request
      // that owned it returned 2xx.
      async function handleSend() {
        const text = input.value.trim();
        if (!text && stagedFiles.length === 0) return;

        updateComposerState(true);
        try {
          while (stagedFiles.length > 0) {
            const file = stagedFiles[0];
            const formData = new FormData();
            formData.append("file", file);
            try {
              const res = await fetch("/api/ingest/file", { method: "POST", body: formData });
              const data = await readJson(res);
              if (!res.ok) throw new Error(data.message || `HTTP ${res.status}`);
              feedAppend("receipt", receiptLine(data, file.name));
              stagedFiles.shift();
              renderAttachments();
            } catch (err) {
              feedAppend("error", `Upload failed [${file.name}]: ${err.message}`);
              markChipError(0);
              break;
            }
          }

          if (text) {
            const res = await fetch("/api/ingest/capture", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ text })
            });
            const data = await readJson(res);
            if (!res.ok) throw new Error(data.message || `HTTP ${res.status}`);
            feedAppend("receipt", receiptLine(data, preview(text)));
            input.value = "";
            autoGrow(input);
          }
        } catch (err) {
          feedAppend("error", `Submission failed: ${err.message}`);
        } finally {
          updateComposerState(false);
        }
      }

      async function handleUrl() {
        const url = input.value.trim();
        if (!isBareUrl(url)) return;

        updateComposerState(true);
        try {
          const res = await fetch("/api/ingest/capture", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url })
          });
          const data = await readJson(res);
          if (!res.ok) throw new Error(data.message || `HTTP ${res.status}`);
          feedAppend("receipt", receiptLine(data, url));
          input.value = "";
          autoGrow(input);
        } catch (err) {
          feedAppend("error", `Clip failed: ${err.message}`);
        } finally {
          updateComposerState(false);
        }
      }

      async function handleAsk() {
        const question = input.value.trim();
        if (!question) return;

        feedAppend("user-query", question);
        input.value = "";
        autoGrow(input);
        updateComposerState(true);
        try {
          const res = await fetch("/api/chat/llama", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: question, history: chatHistory })
          });
          const data = await readJson(res);
          if (!res.ok) throw new Error(data.message || `HTTP ${res.status}`);
          feedAppend("reply", data.reply || "(no response)");
          chatHistory.push({ role: "user", content: question });
          chatHistory.push({ role: "assistant", content: data.reply || "" });
        } catch (err) {
          feedAppend("error", `Ask failed: ${err.message}`);
        } finally {
          updateComposerState(false);
        }
      }

      input.addEventListener("input", () => {
        updateComposerState(false);
        autoGrow(input);
      });

      input.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        if (e.ctrlKey || e.metaKey) {
          // Accelerator beyond ADR27, and only ever active when the URL rule
          // already holds, so it carries none of the ambiguity the ADR rejects.
          e.preventDefault();
          if (!btnUrl.disabled) handleUrl();
          return;
        }
        if (e.shiftKey) return;
        e.preventDefault();
        handleSend();
      });

      input.addEventListener("paste", (e) => {
        const files = e.clipboardData && e.clipboardData.files;
        if (files && files.length) {
          e.preventDefault();
          stageFiles(files);
        }
      });

      btnSend.addEventListener("click", handleSend);
      btnUrl.addEventListener("click", handleUrl);
      btnAsk.addEventListener("click", handleAsk);
      btnAttach.addEventListener("click", () => fileInput.click());

      fileInput.addEventListener("change", () => {
        if (fileInput.files.length) stageFiles(fileInput.files);
        // Without this, picking the same file twice fires no change event.
        fileInput.value = "";
      });

      attachments.addEventListener("click", (e) => {
        const btn = e.target.closest(".remove-btn");
        if (!btn) return;
        stagedFiles.splice(Number(btn.getAttribute("data-index")), 1);
        renderAttachments();
      });

      // Drag counter: dragleave fires on the container every time the pointer
      // crosses a child boundary, so a naive add/remove pair strobes the border.
      composer.addEventListener("dragenter", (e) => {
        e.preventDefault();
        if (++dragCounter === 1) composer.classList.add("dragover");
      });
      composer.addEventListener("dragover", (e) => e.preventDefault());
      composer.addEventListener("dragleave", (e) => {
        e.preventDefault();
        if (--dragCounter === 0) composer.classList.remove("dragover");
      });
      composer.addEventListener("drop", (e) => {
        e.preventDefault();
        dragCounter = 0;
        composer.classList.remove("dragover");
        if (e.dataTransfer.files.length) stageFiles(e.dataTransfer.files);
      });

      autoGrow(input);
      updateComposerState(false);

      // ---- Status refresh ----
      document.getElementById("status-refresh").addEventListener("click", () => {
        fetch("/api/status")
          .then(res => res.json())
          .then(data => {
            const grid = document.getElementById("jobs-grid");
            grid.innerHTML = `
              <div class="stat-box"><div class="stat-value">${data.activeCount || 0}</div><div class="stat-label">Active</div></div>
              <div class="stat-box"><div class="stat-value">${data.pendingCount || 0}</div><div class="stat-label">Pending</div></div>
              <div class="stat-box"><div class="stat-value">${data.completedCount || 0}</div><div class="stat-label">Completed</div></div>
              <div class="stat-box"><div class="stat-value">${data.failedCount || 0}</div><div class="stat-label">Failed</div></div>
            `;
          });
      });

      // ---- Search ----
      const searchForm = document.getElementById("search-form");
      searchForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const query = document.getElementById("search-input").value;
        if (!query.trim()) return;
        fetch(`/api/search?q=${encodeURIComponent(query)}`)
          .then(res => res.json())
          .then(data => {
            const results = document.getElementById("search-results");
            results.innerHTML = (data.results || []).map(r => `<div style="padding: 8px; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 8px;"><strong>${r.title || r.path}</strong><br><em>${r.snippet || ""}</em></div>`).join("");
          });
      });
    }

    renderNav();
    renderPanels();
  </script>
</body>
</html>
