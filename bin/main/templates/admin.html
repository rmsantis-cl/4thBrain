<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Menu — 4thBrain</title>
  <style>
    body {
      margin: 0;
      background: #191817;
      color: #f2efe9;
      font-family: -apple-system, "Segoe UI", Inter, sans-serif;
      padding: 40px;
    }
    h1 { font-size: 28px; margin-bottom: 24px; }
    .menu { display: grid; gap: 12px; max-width: 300px; }
    .menu-item {
      padding: 16px;
      background: #211f1d;
      border: 1px solid #34322e;
      border-radius: 8px;
      text-decoration: none;
      color: #f2efe9;
      font-weight: 600;
      display: block;
      text-align: center;
      transition: all 0.2s;
    }
    .menu-item:hover {
      background: #2a2825;
      border-color: #d97757;
    }
    a { color: #d97757; }
  </style>
</head>
<body>
  <h1>Admin Tools</h1>
  <div class="menu">
    <a href="/admin/db" class="menu-item">📊 Database Browser</a>
    <a href="/admin/api/docs" class="menu-item">📖 API Documentation</a>
    <a href="/chat" class="menu-item">⬅ Back to Chat</a>
  </div>
</body>
</html>
